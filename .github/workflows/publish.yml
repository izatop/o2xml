name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: Resolve release tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            candidate="$DISPATCH_TAG"
          else
            candidate="$PUSH_TAG"
          fi

          if [[ -z "$candidate" ]] || [[ "$candidate" != v* ]] || ! git check-ref-format --allow-onelevel "$candidate"; then
            echo "Invalid release tag" >&2
            exit 1
          fi

          printf 'tag=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
  publish:
    needs: resolve-tag
    runs-on: ubuntu-latest
    name: Publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun ci
      - name: Audit dependencies
        run: bun run security
      - run: bun run check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --provenance
